name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 4 days at 08:00 UTC (within the 7-day pause window)
    - cron: "0 8 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      # Only what the self-renew step needs; everything else stays unset.
      actions: write
    steps:
      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which would silently stop the ping below and let Supabase
      # pause. Re-enabling through the API resets that timer on every run.
      # Kept first so a Supabase outage can never take the schedule down too.
      - name: Keep this workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow#${GITHUB_REPOSITORY}/.github/workflows/}"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"

      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/children?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase response: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status $STATUS"
            exit 1
          fi
